version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G404 # math/rand only shuffles playlists; it is not used for anything security related
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
