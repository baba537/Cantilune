name: Suggestion
description: Suggest a new situation, a new preset or another improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type of suggestion
      options:
        - New situation
        - New preset
        - Better song selection
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: preset
    attributes:
      label: Genres and filters
      description: For situations and presets, optionally list suitable genres, a BPM range or years.
      placeholder: 'e.g. { "name": "Phonk", "genres": ["Phonk", "Drift Phonk"], "minBpm": 120, "maxBpm": 160 }'
      render: json
