name: Bug report
description: Report a problem with Cantilune
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the situation "Gym" with the preset "Hardstyle"
        2. Save the settings
        3. …
  - type: input
    id: cantilune-version
    attributes:
      label: Cantilune version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: navidrome-version
    attributes:
      label: Navidrome version
      placeholder: e.g. 0.64.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Docker
        - Linux package
        - Binary
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Relevant lines from the Navidrome log, ideally with `Plugins.LogLevel = "debug"`.
      render: text
