name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  TINYGO_VERSION: "0.42.0"
  BINARYEN_VERSION: "132"
  GOLANGCI_LINT_VERSION: "v2.13.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint (WebAssembly target)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: wasip1
          GOARCH: wasm
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: manifest.json matches catalog/presets.json
        run: go generate ./... && git diff --exit-code manifest.json
      - name: Unit and integration tests (race detector)
        run: go test -race ./...
      - name: Fuzzing (15 s per target)
        run: make fuzz
      - name: Load profile (100,000 songs, 10 users)
        run: |
          CANTILUNE_LOAD=1 go test -run TestLoadProfile -v . | tee load.txt
          grep -E 'library|duration|API calls|memory' load.txt | sed 's/^ *bench_test.go:[0-9]*: //' > load-summary.txt
          { echo '### Load profile'; cat load-summary.txt; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Load profile::$(paste -sd ';' load-summary.txt)"
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build (reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}
          binaryen-version: ${{ env.BINARYEN_VERSION }}
      - name: Build twice from a clean cache and compare
        run: |
          make checksums VERSION="0.0.0-ci.${GITHUB_SHA::7}" WEBSITE="${{ github.server_url }}/${{ github.repository }}"
          cp dist/SHA256SUMS first.sha256
          make clean && tinygo clean
          make checksums VERSION="0.0.0-ci.${GITHUB_SHA::7}" WEBSITE="${{ github.server_url }}/${{ github.repository }}"
          diff first.sha256 dist/SHA256SUMS
          { echo '### Reproducible build'; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Reproducible build ($(go version | cut -d' ' -f3), $(tinygo version | sed 's/ (using.*LLVM version / LLVM /; s/)$//'))::$(paste -sd ';' dist/SHA256SUMS)"
      - uses: actions/upload-artifact@v7
        with:
          name: cantilune-ndp
          path: |
            dist/cantilune.ndp
            dist/SHA256SUMS

  e2e:
    name: E2E Navidrome ${{ matrix.navidrome }}${{ matrix.update && ' (update)' || '' }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - navidrome: "0.63.2"
          - navidrome: "0.64.1"
          # install the latest release first, then update to this build
          - navidrome: "0.64.1"
            update: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cantilune-ndp
          path: dist
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download the latest release
        if: matrix.update
        run: curl -fsSL -o previous.ndp "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/cantilune.ndp"
      - name: Run end-to-end test
        run: bash scripts/e2e.sh "${{ matrix.navidrome }}" dist/cantilune.ndp ${{ matrix.update && 'previous.ndp' || '' }}
