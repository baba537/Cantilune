name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Check manifest
        run: jq -e '.name and .author and .version and .config.schema' manifest.json > /dev/null

      - name: Tests
        run: go test ./...

      - name: Build package
        run: make package VERSION="0.0.0-ci.${GITHUB_SHA::7}" WEBSITE="${{ github.server_url }}/${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cantilune-ndp
          path: dist/cantilune.ndp
