name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"

      - name: Abhängigkeiten auflösen
        run: go mod tidy

      - name: Tests
        run: go test ./...

      - name: Paket bauen
        run: make package VERSION="${GITHUB_REF_NAME#v}" WEBSITE="${{ github.server_url }}/${{ github.repository }}"

      - name: Paketinhalt anzeigen
        run: unzip -l dist/cantilune.ndp && jq '{name, version, website}' dist/manifest.json

      - name: Release-Notizen aus dem Changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "Keine Einträge im Changelog für $version." > dist/release-notes.md
          fi
          printf '\n---\n\n**Installation:** `cantilune.ndp` herunterladen und in den Plugin-Ordner von Navidrome kopieren. Details im [README](%s/%s#installation).\n' \
            "${{ github.server_url }}" "${{ github.repository }}" >> dist/release-notes.md
          cat dist/release-notes.md

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cantilune.ndp
          body_path: dist/release-notes.md
