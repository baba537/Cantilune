name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Tests
        run: go test ./...

      - name: Build package
        run: make package VERSION="${GITHUB_REF_NAME#v}" WEBSITE="${{ github.server_url }}/${{ github.repository }}"

      - name: Show package contents
        run: unzip -l dist/cantilune.ndp && jq '{name, version, website}' dist/manifest.json

      - name: Release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "No changelog entries for $version." > dist/release-notes.md
          fi
          printf '\n---\n\n**Installation:** download `cantilune.ndp` and copy it into the Navidrome plugin folder. See the [README](%s/%s#installation) for details.\n' \
            "${{ github.server_url }}" "${{ github.repository }}" >> dist/release-notes.md
          cat dist/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cantilune.ndp
          body_path: dist/release-notes.md
